# =============================================================================
# Benchmark Viewer - Test Configuration
# =============================================================================

# --- Datasource (H2 in-memory for tests) ---
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# --- Hibernate Search (Lucene in-memory for tests) ---
spring.jpa.properties.hibernate.search.backend.type=lucene
spring.jpa.properties.hibernate.search.backend.directory.type=local-heap
spring.jpa.properties.hibernate.search.automatic_indexing.synchronization.strategy=sync

# --- Thymeleaf ---
spring.thymeleaf.cache=false

# --- Benchmark Data Directory (empty for tests by default) ---
benchmark.data.directory=
