<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="content" id="sidebar-content" hx-swap-oob="true" data-bs-theme="dark">
    <div class="px-3 pb-3 text-light">
        <h6 class="text-uppercase text-white-50 fw-bold mb-3 fs-7" style="letter-spacing: 0.5px;">Filters</h6>
        
        <form id="filter-form" 
              th:attr="hx-get=${filterActionUrl}"
              hx-target="#main-content" 
              hx-swap="innerHTML"
              hx-trigger="change">
            
            <div class="d-flex justify-content-between align-items-center mb-3">
                <span class="small text-white-50" th:text="${matrix != null ? matrix.size() + ' environments' : ''}"></span>
                <button type="button" class="btn btn-sm btn-link text-white-50 text-decoration-none p-0" 
                        onclick="document.getElementById('filter-form').reset(); htmx.trigger('#filter-form', 'change');">Clear All</button>
            </div>

            <div class="accordion accordion-flush tm-filter-accordion" id="filterAccordion">
                
                <!-- Macro for a facet group -->
                <div th:each="facetEntry : ${facets}" class="accordion-item bg-transparent border-0 mb-2">
                    <h2 class="accordion-header">
                        <button class="accordion-button collapsed bg-transparent shadow-none px-0 py-2 fw-medium" type="button" 
                                data-bs-toggle="collapse" th:attr="data-bs-target='#collapse-' + ${facetEntry.key}" 
                                aria-expanded="false">
                            <span class="text-capitalize" th:text="${facetEntry.key}">Dimension</span>
                            <span class="badge bg-secondary ms-2 rounded-pill" th:if="${activeFilters.getActiveFilters().get(facetEntry.key) != null && !activeFilters.getActiveFilters().get(facetEntry.key).isEmpty()}" th:text="${activeFilters.getActiveFilters().get(facetEntry.key).size()}"></span>
                        </button>
                    </h2>
                    <div th:id="'collapse-' + ${facetEntry.key}" class="accordion-collapse collapse" data-bs-parent="#filterAccordion">
                        <div class="accordion-body px-0 py-1">
                            <div th:each="termEntry : ${facetEntry.value}" class="form-check custom-checkbox mb-2">
                                <input class="form-check-input" type="checkbox" 
                                       th:name="${facetEntry.key}" 
                                       th:value="${termEntry.key}" 
                                       th:id="'filter-' + ${facetEntry.key} + '-' + ${termEntry.key}"
                                       th:checked="${activeFilters.getActiveFilters().get(facetEntry.key) != null && activeFilters.getActiveFilters().get(facetEntry.key).contains(termEntry.key)}">
                                <label class="form-check-label d-flex justify-content-between align-items-center w-100" 
                                       th:for="'filter-' + ${facetEntry.key} + '-' + ${termEntry.key}">
                                    <span class="text-truncate me-2" style="min-width: 0;" th:title="${termEntry.key}" th:text="${#strings.isEmpty(termEntry.key) ? '(None)' : termEntry.key}">Value</span>
                                    <span class="badge bg-light text-dark border" th:text="${termEntry.value}">0</span>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </form>
    </div>
</div>

</body>
</html>
