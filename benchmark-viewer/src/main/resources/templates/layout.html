<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="description" content="Interactive benchmark result explorer for 1BRC performance analysis"/>

    <title layout:title-pattern="$CONTENT_TITLE - $LAYOUT_TITLE">Benchmark Explorer</title>


    <!-- Local Fonts: Inter & JetBrains Mono -->
    <link th:href="@{/fonts/fonts.css}" rel="stylesheet"/>

    <!-- Bootstrap 5.3 CSS (local) -->
    <link th:href="@{/vendor/bootstrap.min.css}" rel="stylesheet"/>

    <!-- Bootstrap Icons (local) -->
    <link th:href="@{/vendor/bootstrap-icons.min.css}" rel="stylesheet"/>

    <!-- Custom Premium CSS -->
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>

    <div class="app-layout">
        
        <!-- Sidebar (Desktop) -->
        <aside class="tm-sidebar d-none d-lg-flex" id="sidebar">
            <a class="tm-brand" th:href="@{/} + ${currentQueryString}"
               th:attr="hx-get=@{/} + ${currentQueryString}" hx-target="#main-content" hx-push-url="true">
                <i class="bi bi-rocket-takeoff"></i>
                Explorer
            </a>
            <div layout:fragment="sidebar" id="sidebar-content">
                <div class="sidebar-placeholder p-3">
                    <i class="bi bi-funnel me-2"></i> Filters will appear here
                </div>
            </div>
        </aside>

        <!-- Sidebar (Mobile Offcanvas) -->
        <div class="offcanvas offcanvas-start d-lg-none border-end-0 shadow" tabindex="-1" id="sidebar-offcanvas" aria-labelledby="sidebarOffcanvasLabel">
            <div class="offcanvas-header pb-0">
                <h5 class="offcanvas-title fw-bold" id="sidebarOffcanvasLabel">
                    <i class="bi bi-rocket-takeoff text-primary me-2"></i>Explorer
                </h5>
                <button type="button" class="btn-close shadow-none" data-bs-dismiss="offcanvas" aria-label="Close"></button>
            </div>
            <div class="offcanvas-body">
                <div layout:fragment="sidebar-mobile">
                    <!-- HTMX will copy the desktop sidebar here or we can just swap both. Actually, if we use the same ID, HTMX won't duplicate. We can duplicate the fragment inside run-detail.html or use JS to move it. Let's just create a secondary target. -->
                </div>
            </div>
        </div>

        <!-- Main Container -->
        <main class="tm-main" id="main-wrapper">
            
            <!-- Navbar (Glassmorphism) -->
            <nav class="tm-navbar d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center">
                    <!-- Mobile toggle -->
                    <button class="btn btn-link text-secondary text-decoration-none p-0 me-3 d-lg-none"
                            type="button"
                            data-bs-toggle="offcanvas"
                            data-bs-target="#sidebar-offcanvas">
                        <i class="bi bi-list fs-2"></i>
                    </button>
                    <!-- Breadcrumbs -->
                    <nav aria-label="breadcrumb" class="mb-0">
                        <ol class="breadcrumb mb-0" id="breadcrumb" style="list-style: none; padding-left: 0;">
                            <li layout:fragment="breadcrumb" class="breadcrumb-item active fs-6">
                                <i class="bi bi-house-door"></i> Runs
                            </li>
                        </ol>
                    </nav>
                </div>
                <div>
                    <span class="badge rounded-pill tm-badge-brand px-3 py-2 fw-medium shadow-sm">1BRC</span>
                </div>
            </nav>

            <!-- Dynamic Content Area -->
            <div class="tm-content" id="main-content">
                <div layout:fragment="content">
                    <!-- Page content injected here -->
                </div>
            </div>
        </main>
        
    </div>

    <!-- Global Spinner Overlay -->
    <div id="global-spinner" class="htmx-indicator position-fixed top-0 start-0 w-100 h-100 bg-white bg-opacity-75 justify-content-center align-items-center" style="z-index: 9999;">
        <div class="d-flex flex-column align-items-center">
            <div class="spinner-border text-primary mb-3" role="status" style="width: 3.5rem; height: 3.5rem;">
                <span class="visually-hidden">Loading...</span>
            </div>
            <div class="fw-bold text-primary">Processing Request...</div>
        </div>
    </div>

    <!-- Toast Notifications Container -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1055;">
        <div id="app-toast" class="toast align-items-center text-white border-0 shadow-lg" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex text-white">
                <div class="toast-body fw-medium" id="toast-body-content">
                    Notification Message
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <!-- Scripts (local) -->
    <script th:src="@{/vendor/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/vendor/htmx.min.js}"></script>
    <script th:src="@{/vendor/echarts.min.js}"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Initialize tooltips initially
            const initTooltips = () => {
                var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
                tooltipTriggerList.forEach(function (tooltipTriggerEl) {
                    var t = bootstrap.Tooltip.getInstance(tooltipTriggerEl);
                    if (t) {
                        t.dispose();
                    }
                    new bootstrap.Tooltip(tooltipTriggerEl);
                });
            };
            
            initTooltips();

            // Re-initialize tooltips on HTMX load
            document.body.addEventListener('htmx:afterOnLoad', () => {
                initTooltips();
            });

            // Show Toast helper
            function showToast(message, isSuccess = true) {
                const toastEl = document.getElementById('app-toast');
                const bodyEl = document.getElementById('toast-body-content');
                if (!toastEl || !bodyEl) {
                    return;
                }

                bodyEl.textContent = message;
                toastEl.classList.remove('bg-success', 'bg-danger');
                toastEl.classList.add(isSuccess ? 'bg-success' : 'bg-danger');

                const toast = new bootstrap.Toast(toastEl, { delay: 4000 });
                toast.show();
            }

            // Handle HTMX responses (like re-import results)
            document.body.addEventListener('htmx:afterRequest', (event) => {
                const xhr = event.detail.xhr;
                const path = event.detail.pathInfo.requestPath;
                
                if (path === '/admin/reimport') {
                    if (event.detail.successful) {
                        try {
                            const res = JSON.parse(xhr.responseText);
                            showToast(res.message || 'Data re-imported successfully!', true);
                            setTimeout(() => {
                                window.location.reload();
                            }, 1200);
                        } catch (e) {
                            showToast('Data re-imported successfully!', true);
                            setTimeout(() => {
                                window.location.reload();
                            }, 1200);
                        }
                    } else {
                        showToast('Re-import failed: ' + (xhr.statusText || 'Server Error'), false);
                    }
                }
            });

            // Global error handler for HTMX requests
            document.body.addEventListener('htmx:responseError', (event) => {
                showToast('Request failed with status ' + event.detail.xhr.status, false);
            });
            document.body.addEventListener('htmx:sendError', () => {
                showToast('Network error, please check connection', false);
            });
        });
    </script>

    <script layout:fragment="scripts"></script>
</body>
</html>
