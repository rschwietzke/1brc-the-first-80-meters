<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title th:text="'1BRC Benchmark - Test Case: ' + ${simpleClassName}">1BRC Benchmark - Test Case</title>
</head>
<body>

    <!-- Breadcrumb -->
    <th:block layout:fragment="breadcrumb">
        <li class="breadcrumb-item fs-6">
            <a th:href="@{/} + ${currentQueryString}" th:attr="hx-get=@{/} + ${currentQueryString}" hx-target="#main-content" hx-swap="innerHTML" hx-push-url="true" class="text-decoration-none">
                <i class="bi bi-house-door"></i> Runs
            </a>
        </li>
        <li class="breadcrumb-item active fs-6" aria-current="page" th:text="${simpleClassName}"></li>
    </th:block>

    <!-- Sidebar -->
    <div layout:fragment="sidebar" class="px-3">
        <div th:replace="~{fragments/sidebar :: content}"></div>
    </div>

    <!-- Main content -->
    <div layout:fragment="content">
        <div th:replace="~{testcase :: page-content}"></div>
    </div>

    <!-- HTMX Response Block -->
    <th:block th:fragment="htmx-response">
        <div th:replace="~{fragments/sidebar :: content}"></div>
        <div th:replace="~{testcase :: page-content}"></div>
        
        <!-- Breadcrumb swap (OOB) -->
        <ol id="breadcrumb" hx-swap-oob="true" class="breadcrumb mb-0" style="list-style: none; padding-left: 0;">
            <li class="breadcrumb-item fs-6">
                <a th:href="@{/} + ${currentQueryString}" th:attr="hx-get=@{/} + ${currentQueryString}" hx-target="#main-content" hx-swap="innerHTML" hx-push-url="true" class="text-decoration-none">
                    <i class="bi bi-house-door"></i> Runs
                </a>
            </li>
            <li class="breadcrumb-item active fs-6" aria-current="page" th:text="${simpleClassName}"></li>
        </ol>
    </th:block>

    <!-- Page Content Fragment -->
    <div th:fragment="page-content" class="fade-in" id="testcase-main">

            <div class="container-fluid pb-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h2 class="h3 mb-1">
                            <span class="text-dark" th:text="${simpleClassName}">Class Name</span>
                        </h2>
                        <p class="text-muted mb-0 font-monospace small" th:text="${className}">Full Class Name</p>
                    </div>
                    <div class="d-flex gap-2">
                        <a th:href="@{/testcase/{className}/trends(className=${className})} + ${currentQueryString}"
                           th:attr="hx-get=@{/testcase/{className}/trends(className=${className})} + ${currentQueryString}"
                           class="btn btn-outline-primary"
                           hx-target="#main-content"
                           hx-swap="innerHTML"
                           hx-push-url="true"><i class="bi bi-graph-up me-1"></i>Trends</a>
                        <button id="compareBtn" class="btn btn-primary" disabled onclick="compareSelected()"><i class="bi bi-layout-split me-1"></i>Compare Selected (0/2)</button>
                    </div>
                </div>

                <div class="card shadow-sm border-0 overflow-hidden">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle bg-white mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th class="px-3" style="width: 40px;"></th>
                                        <th>Run Timestamp</th>
                                        <th>JDK</th>
                                        <th>Dataset</th>
                                        <th>Hardware</th>
                                        <th class="text-end">Median (ms)</th>
                                        <th class="text-center">Status</th>
                                        <th class="text-end">Details</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:if="${measurements.isEmpty()}">
                                        <td colspan="8" class="text-center py-4 text-muted">No executions found for this test case matching the active filters.</td>
                                    </tr>
                                    <tr th:each="m : ${measurements}">
                                        <td class="px-3 text-center">
                                            <input class="form-check-input compare-cb" type="checkbox" th:value="${m.id}" onchange="updateCompareBtn()">
                                        </td>
                                        <td>
                                            <a th:href="@{/runs/{ts}(ts=${#temporals.format(m.testRun.timestamp, 'yyyy-MM-dd''T''HH:mm:ss')})} + ${currentQueryString}"
                                               class="text-decoration-none text-dark"
                                               th:attr="hx-get=@{/runs/{ts}(ts=${#temporals.format(m.testRun.timestamp, 'yyyy-MM-dd''T''HH:mm:ss')})} + ${currentQueryString}"
                                               hx-target="#main-content"
                                               hx-swap="innerHTML"
                                               hx-push-url="true">
                                                <span th:text="${#temporals.format(m.testRun.timestamp, 'yyyy-MM-dd''T''HH:mm''Z''')}"></span>
                                            </a>
                                        </td>
                                        <td th:text="${m.jdk}"></td>
                                        <td><span class="badge bg-light text-dark font-monospace" th:text="${m.dataset}"></span></td>
                                        <td>
                                            <div class="small text-muted" th:title="${m.testRun.cpu} + ' (' + ${m.testRun.cpuCores} + ' cores)'">
                                                <span th:text="${m.testRun.hostname}"></span>
                                            </div>
                                        </td>
                                        <td class="text-end font-monospace fw-bold" th:text="${m.medianRuntimeMs}"></td>
                                        <td class="text-center">
                                            <i th:if="${m.error}" class="bi bi-x-circle-fill text-danger" title="Error"></i>
                                            <i th:unless="${m.error}" class="bi bi-check-circle-fill text-success" title="Success"></i>
                                        </td>
                                        <td class="text-end pe-3">
                                            <a th:href="@{/runs/{ts}/detail/{id}(ts=${#temporals.format(m.testRun.timestamp, 'yyyy-MM-dd''T''HH:mm:ss')}, id=${m.id})} + ${currentQueryString}"
                                               class="btn btn-sm btn-outline-secondary"
                                               title="View Details">
                                                <i class="bi bi-info-circle"></i>
                                            </a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
            
            <script th:inline="javascript">
                function updateCompareBtn() {
                    const checkboxes = document.querySelectorAll('.compare-cb:checked');
                    const btn = document.getElementById('compareBtn');
                    btn.disabled = checkboxes.length !== 2;
                    btn.innerHTML = `<i class="bi bi-layout-split me-1"></i>Compare Selected (${checkboxes.length}/2)`;
                    
                    // Disable unchecked checkboxes if 2 are already selected
                    document.querySelectorAll('.compare-cb:not(:checked)').forEach(cb => {
                        cb.disabled = checkboxes.length >= 2;
                    });
                }

                function compareSelected() {
                    const checkboxes = document.querySelectorAll('.compare-cb:checked');
                    if (checkboxes.length === 2) {
                        const m1 = checkboxes[0].value;
                        const m2 = checkboxes[1].value;
                        window.location.href = '/compare-executions?m1=' + m1 + '&m2=' + m2 + (window.location.search ? '&' + window.location.search.substring(1) : '');
                    }
                }
            </script>
        </main>
    </div>
</body>
</html>
