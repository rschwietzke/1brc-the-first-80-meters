# =============================================================================
# Benchmark Viewer - Application Configuration
# =============================================================================

# --- Server ---
server.port=8080

# --- Datasource (H2 file-mode for persistence between restarts) ---
spring.datasource.url=jdbc:h2:file:./data/benchmark-viewer-db;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# --- H2 Console (for development debugging) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Hibernate Search (Lucene backend) ---
spring.jpa.properties.hibernate.search.backend.type=lucene
spring.jpa.properties.hibernate.search.backend.directory.root=./data/benchmark-viewer-index

# --- Thymeleaf ---
spring.thymeleaf.cache=false

# --- Benchmark Data Directory ---
benchmark.data.directory=./data/benchmark-history
